services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    mem_limit: 1g

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
      mc mb -p local/raw-data;
      exit 0;
      "

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: contextlens
      POSTGRES_USER: ${POSTGRES_USER:-contextlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextlens}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --max-model-len 2048
      --gpu-memory-utilization 0.9
      --max-num-seqs 4
      --dtype float16

volumes:
  minio_data:
  postgres_data:
