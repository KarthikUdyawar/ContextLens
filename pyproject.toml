[project]
name = "contextlens"
version = "2.1.0"
description = "Unveiling Hidden Sentiments through Contextual Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Karthik Udyawar", email = "karthikajitudy@gmail.com" },
]
license = { text = "Apache License" }
keywords = ["sentiment-analysis", "nlp", "bert", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: FastAPI",
]

dependencies = [
    "emoji>=2.15.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
]

[project.urls]
Homepage = "https://github.com/KarthikUdyawar/ContextLens"
Repository = "https://github.com/KarthikUdyawar/ContextLens"
Issues = "https://github.com/KarthikUdyawar/ContextLens/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "jupyter-client>=8.9.1",
    "jupyter-core>=5.9.1",
    "jupyter-events>=0.12.1",
    "jupyter-lsp>=2.3.1",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.6.2",
    "jupyterlab-server>=2.28.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "notebook>=7.6.1",
    "notebook-shim>=0.2.4",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.4",
    "mypy>=1.19.1",
    "bandit>=1.9.4",
]
train = [
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "nltk>=3.10.2",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "textblob>=0.20.1",
    "threadpoolctl>=3.6.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "wordcloud>=1.9.6",
]
ingest = [
    "minio>=7.2.0",
    "kaggle>=1.7.0",
    "datasets>=3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebook/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", "venv", "notebook"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["textblob.*", "emoji.*"]
ignore_missing_imports = true
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
    "src/pipeline/build_datasets.py",
    "src/pipeline/build_model.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
